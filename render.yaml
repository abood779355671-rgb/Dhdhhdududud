services:
  - type: web
    name: tohfa
    env: node
    region: frankfurt
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tohfa-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: OWNER_USERNAME
        value: admin
      - key: OWNER_PASSWORD
        value: admin123
      - key: NODE_ENV
        value: production

databases:
  - name: tohfa-db
    databaseName: tohfa
    plan: free
    region: frankfurt
